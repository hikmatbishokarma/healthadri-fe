  <rect x="58" y="132" width="20" height="20" rx="3" fill="#E8F5F1" stroke="#1A6B5A" stroke-width="1.5"/>

  <!-- Windows (right) -->
  <rect x="122" y="104" width="20" height="20" rx="3" fill="#E8F5F1" stroke="#1A6B5A" stroke-width="1.5"/>
  <rect x="122" y="132" width="20" height="20" rx="3" fill="#E8F5F1" stroke="#1A6B5A" stroke-width="1.5"/>

  <!-- Door -->
  <rect x="86" y="128" width="28" height="34" rx="4" fill="#C6E8DC" stroke="#1A6B5A" stroke-width="1.5"/>
  <circle cx="108" cy="146" r="2.5" fill="#1A6B5A"/>
