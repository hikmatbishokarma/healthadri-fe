<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background -->
  <circle cx="100" cy="108" r="80" fill="#E8F5F1"/>

  <!-- Calendar card -->
  <rect x="40" y="72" width="120" height="104" rx="10" fill="white" stroke="#1A6B5A" stroke-width="2"/>

  <!-- Calendar header -->
  <rect x="40" y="72" width="120" height="32" rx="10" fill="#1A6B5A"/>
  <rect x="40" y="88" width="120" height="16" fill="#1A6B5A"/>

  <!-- Header pins -->
  <rect x="66" y="64" width="8" height="18" rx="4" fill="#1A6B5A"/>
  <rect x="126" y="64" width="8" height="18" rx="4" fill="#1A6B5A"/>

  <!-- Month label placeholder -->
  <rect x="76" y="80" width="48" height="8" rx="4" fill="white" opacity="0.5"/>

  <!-- Day grid row 1 -->
  <rect x="52" y="116" width="14" height="14" rx="4" fill="#E8F5F1"/>
  <rect x="72" y="116" width="14" height="14" rx="4" fill="#E8F5F1"/>
  <rect x="92" y="116" width="14" height="14" rx="4" fill="#E8F5F1"/>
  <rect x="112" y="116" width="14" height="14" rx="4" fill="#E8F5F1"/>
  <rect x="132" y="116" width="14" height="14" rx="4" fill="#E8F5F1"/>

  <!-- Day grid row 2 -->
  <rect x="52" y="136" width="14" height="14" rx="4" fill="#E8F5F1"/>
  <rect x="72" y="136" width="14" height="14" rx="4" fill="#C6E8DC"/>
  <rect x="92" y="136" width="14" height="14" rx="4" fill="#E8F5F1"/>
  <rect x="112" y="136" width="14" height="14" rx="4" fill="#E8F5F1"/>
  <rect x="132" y="136" width="14" height="14" rx="4" fill="#E8F5F1"/>

  <!-- Day grid row 3 -->
  <rect x="52" y="156" width="14" height="14" rx="4" fill="#E8F5F1"/>
  <rect x="72" y="156" width="14" height="14" rx="4" fill="#E8F5F1"/>
  <rect x="92" y="156" width="14" height="14" rx="4" fill="#E8F5F1"/>
  <rect x="112" y="156" width="14" height="14" rx="4" fill="#E8F5F1"/>
  <rect x="132" y="156" width="14" height="14" rx="4" fill="#E8F5F1"/>

  <!-- Empty state dash across rows -->
  <path d="M58 116 L145 116" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
  <path d="M58 136 L145 136" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
</svg>
