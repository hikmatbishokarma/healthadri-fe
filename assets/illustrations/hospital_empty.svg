<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background -->
  <circle cx="100" cy="110" r="80" fill="#E8F5F1"/>

  <!-- Ground line -->
  <rect x="30" y="162" width="140" height="4" rx="2" fill="#C6E8DC"/>

  <!-- Building body -->
  <rect x="48" y="90" width="104" height="72" rx="4" fill="white" stroke="#1A6B5A" stroke-width="2"/>

  <!-- Roof / top section -->
